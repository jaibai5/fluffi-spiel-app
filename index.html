<style>
/* Fluffis Abenteuer – Stil. Ziel: Fire HD 8 quer (ca. 960x600 CSS-Pixel), grosse Tippflaechen. */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #7cc4ff; }
body {
  font-family: "Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif; font-weight: 800; color: #3b3650;
  user-select: none; -webkit-user-select: none; touch-action: manipulation; overscroll-behavior: none;
}

#app { position: fixed; inset: 0; }
.screen { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(#8fd0ff, #dff2ff 70%); }

/* Schneefall */
.snow { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

/* Allgemeine Knoepfe */
.round-btn {
  width: 13vmin; height: 13vmin; min-width: 56px; min-height: 56px; border-radius: 50%;
  background: #fff; box-shadow: 0 .8vmin 0 #b9cde0, 0 1vmin 2vmin rgba(0, 0, 0, .15);
  font-size: 6.5vmin; display: flex; align-items: center; justify-content: center; position: relative;
  transition: transform .1s;
}
.round-btn:active { transform: translateY(.6vmin) scale(.96); box-shadow: 0 .2vmin 0 #b9cde0; }
.round-btn.big { width: 18vmin; height: 18vmin; font-size: 9vmin; }

/* Start */
.start-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; }
.title { margin: 0; font-size: 8vmin; color: #fff; text-shadow: 0 .6vmin 0 #4f8fc9; letter-spacing: .05em; z-index: 1; }
.start-fluffi { width: 42vmin; z-index: 1; cursor: pointer; }
.big-play {
  margin-top: 2vmin; width: 22vmin; height: 22vmin; border-radius: 50%; background: #35c46b; color: #fff;
  font-size: 11vmin; box-shadow: 0 1.2vmin 0 #22914c; z-index: 1; padding-left: 2vmin; animation: pulse 1.6s infinite;
}
@keyframes pulse { 50% { transform: scale(1.07); } }
.bounce { animation: bounce 2s ease-in-out infinite; }
@keyframes bounce { 50% { transform: translateY(-3vmin); } }

/* Fluffi-Animationen */
.fluffi .f-wing-l { transform-origin: 40px 130px; }
.fluffi .f-wing-r { transform-origin: 160px 130px; }
.fluffi.wave .f-wing-r { animation: wave 1.4s ease-in-out infinite; }

.f-eyes { animation: blink 4s infinite; transform-origin: 100px 88px; }

/* Karte */
.hub-screen { background: linear-gradient(#7cc4ff, #bfe5ff 45%, #9fd3f5 46%, #7fc0ea 60%); }
.hub-island { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 72%; }
.hub-path { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

.topbar { position: absolute; top: 2vmin; left: 2vmin; right: 2vmin; display: flex; align-items: center; gap: 2vmin; z-index: 3; }
.star-count { background: #fff; border-radius: 10vmin; padding: 1vmin 3vmin 1vmin 1.6vmin; display: flex; align-items: center; gap: 1vmin; box-shadow: 0 .8vmin 0 #b9cde0; }
.star-count .big-star { color: #ffc933; font-size: 8vmin; line-height: 1; text-shadow: 0 0 .1vmin #c99a00; }
.star-count .num { font-size: 7vmin; }
.next-gift { flex: 1; display: flex; align-items: center; gap: 1.5vmin; max-width: 40vmin; }
.gift-bar { flex: 1; height: 3vmin; background: rgba(255, 255, 255, .6); border-radius: 2vmin; overflow: hidden; }
.gift-bar div { height: 100%; background: linear-gradient(90deg, #ff8fb3, #ffc933); border-radius: 2vmin; }
.gift-ico { font-size: 7vmin; animation: wobble 2.5s infinite; }
.top-btns { margin-left: auto; display: flex; gap: 2vmin; }
.hold-ring { position: absolute; inset: -.6vmin; width: calc(100% + 1.2vmin); height: calc(100% + 1.2vmin); transform: rotate(-90deg); pointer-events: none; }
.hold-ring circle { fill: none; stroke: #35c46b; stroke-width: 3; stroke-dasharray: 107; stroke-dashoffset: 107; }
.parent-btn { font-size: 5vmin; opacity: .75; }
.parent-btn.holding .hold-ring circle { transition: stroke-dashoffset 2s linear; stroke-dashoffset: 0; }

.hub-fluffi { position: absolute; left: 1vmin; bottom: 4vmin; width: 26vmin; z-index: 2; cursor: pointer; }
.hub-fluffi.hop { animation: hop .6s; }
@keyframes hop { 40% { transform: translateY(-6vmin) rotate(-5deg); } }

.station {
  position: absolute; width: 21vmin; height: 21vmin; margin: -10.5vmin 0 0 -10.5vmin; border-radius: 50%;
  background: var(--c); box-shadow: 0 1.2vmin 0 rgba(0, 0, 0, .22), inset 0 -1.2vmin 0 rgba(0, 0, 0, .12);

}

.station .st-icon { font-size: 11vmin; line-height: 1; filter: drop-shadow(0 .4vmin 0 rgba(0, 0, 0, .2)); }

.st-need { position: absolute; bottom: -5vmin; background: #fff; border-radius: 3vmin; padding: .3vmin 1.8vmin; font-size: 3.6vmin; white-space: nowrap; color: #c99a00; box-shadow: 0 .5vmin 0 #b9cde0; }
.st-level { position: absolute; bottom: -3.6vmin; display: flex; gap: .7vmin; background: #fff; padding: .8vmin 1.2vmin; border-radius: 3vmin; box-shadow: 0 .5vmin 0 #b9cde0; }
.st-level i, .res-level i { width: 1.8vmin; height: 1.8vmin; border-radius: 50%; background: #dfe7ef; display: block; }
.st-level i.on, .res-level i.on { background: #ffc933; }

/* Sprechblase */
#bubble {
  position: fixed; left: 50%; top: 15vmin; transform: translate(-50%, -40vmin); max-width: 60vw; z-index: 50;
  background: rgba(255, 255, 255, .92); border-radius: 3vmin; padding: .8vmin 2.4vmin; font-size: 2.6vmin; color: #5a5470;

}

/* Spielrahmen */
.game-head { position: absolute; top: 0; left: 0; right: 0; height: 17vmin; display: flex; align-items: center; justify-content: space-between; padding: 0 2vmin; z-index: 5; }

.progress { display: flex; gap: 1.5vmin; align-items: center; }
.progress i { width: 4vmin; height: 4vmin; border-radius: 50%; background: rgba(255, 255, 255, .7); border: .5vmin solid #fff; display: block; transition: all .3s; }
.progress i.now { background: #fff; transform: scale(1.25); }
.progress i.done { background: #ffc933; border-color: #fff; }
.pbar { width: 50vw; height: 4vmin; background: rgba(255, 255, 255, .6); border-radius: 3vmin; position: relative; }
.pbar div { height: 100%; background: linear-gradient(90deg, #ffc933, #ff8fb3); border-radius: 3vmin; }
.pbar-goal { position: absolute; right: -3vmin; top: -2.5vmin; font-size: 6vmin; }
.stage { position: absolute; top: 17vmin; left: 0; right: 0; bottom: 0; }
.game-canvas { position: absolute; inset: 0; touch-action: none; }

.answers { display: flex; gap: 4vmin; justify-content: center; align-items: center; }
.answer-card {
  width: 20vmin; height: 20vmin; background: #fff; border-radius: 4vmin; box-shadow: 0 1.2vmin 0 #b9cde0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform .15s;
}
.answer-card:active { transform: scale(.95); }
.answer-card .num { font-size: 11vmin; line-height: 1; color: #2a3f7a; }
.answer-card .num-dots { width: 9vmin; height: 5vmin; }
.answer-card .num-dots svg { width: 100%; height: 100%; }
.answer-card.correct, .bucket.correct { background: #c9f7d8; box-shadow: 0 1.2vmin 0 #35c46b; transform: scale(1.08); }
.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-2vmin); } 40%, 80% { transform: translateX(2vmin); } }
.hint { animation: hint 1s ease-in-out infinite; box-shadow: 0 0 0 1.2vmin #ffd23f, 0 1.2vmin 0 #b9cde0 !important; }
@keyframes hint { 50% { transform: scale(1.08); } }
.pop-in { animation: popin .4s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes popin { from { transform: scale(0); } }

/* Fische fangen */
.g-fische .screen, .g-fische { background: linear-gradient(#8fd0ff, #cdeeff 30%); }
.sea { position: absolute; left: 0; right: 0; top: 0; height: 58%; }
.waves { position: absolute; top: 0; left: 0; right: 0; height: 4vmin; background: radial-gradient(circle at 2vmin -1vmin, transparent 2.6vmin, #4aa8f0 2.7vmin) repeat-x; background-size: 5vmin 4vmin; }
.water { position: absolute; top: 3.5vmin; left: 0; right: 0; bottom: 0; background: linear-gradient(#4aa8f0, #2f86d6); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.swim-fish { position: absolute; left: 0; top: 0; width: 13vmin; height: 8vmin; cursor: pointer; padding: 1vmin; }
.swim-fish svg, .fly-fish svg, .b-fish svg { width: 100%; height: 100%; }
.fly-fish { position: fixed; width: 13vmin; height: 8vmin; z-index: 30; transition: transform .5s ease-in, opacity .5s; pointer-events: none; }
.shore { position: absolute; left: 0; right: 0; bottom: 0; height: 42%; background: linear-gradient(#f4fbff, #dcefff); display: flex; align-items: center; justify-content: center; }
.bucket {
  position: relative; width: 44vmin; height: 26vmin; background: linear-gradient(#ffb36b, #ff8c42); border-radius: 2vmin 2vmin 8vmin 8vmin;
  border: .8vmin solid #4e4a5e; display: flex; align-items: center; justify-content: center; padding: 1.5vmin;
}
.bucket.tappable { cursor: pointer; }
.bucket-fish { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: .8vmin; max-width: 100%; }
.bucket-fish.many .b-fish, .bucket-fish.many .b-slot { width: 6.4vmin; height: 4vmin; }
.bucket-fish.lots .b-fish, .bucket-fish.lots .b-slot { width: 5.4vmin; height: 3.4vmin; }
.b-fish, .b-slot { width: 8vmin; height: 5vmin; }
.b-slot { border: .5vmin dashed rgba(78, 74, 94, .5); border-radius: 3vmin; }
.target { position: absolute; left: -24vmin; top: 50%; transform: translateY(-50%); background: #fff; border-radius: 3vmin; padding: 1.5vmin; display: flex; flex-direction: column; align-items: center; box-shadow: 0 1vmin 0 #b9cde0; }
.target svg { width: 12vmin; height: 12vmin; }
.target .num { font-size: 9vmin; line-height: 1; color: #2a3f7a; }
.two-buckets { display: flex; gap: 8vmin; }
.two-buckets .bucket { width: 36vmin; }
.big-hint { font-size: 12vmin; animation: bounce 1.2s infinite; }
.jump-in { animation: jumpin .8s; }
@keyframes jumpin { from { transform: translateY(-30vmin) rotate(180deg); opacity: 0; } }
.jump-out { animation: jumpout .8s forwards; }
@keyframes jumpout { to { transform: translateY(-40vmin) rotate(-200deg); opacity: 0; } }

/* Memory */
.g-memory { background: linear-gradient(#c9b6ff, #efe8ff); }
.mem-grid {
  position: absolute; inset: 1vmin 4vmin 3vmin; display: grid; gap: 2vmin;
  grid-template-columns: repeat(var(--cols), min(19vmin, calc((100vw - 8vmin) / var(--cols) - 2vmin)));
  grid-template-rows: repeat(var(--rows), min(19vmin, calc((83vh - 6vmin) / var(--rows) - 2vmin)));
  justify-content: center; align-content: center;
}
.mem-card { perspective: 600px; width: 100%; height: 100%; }
.mem-inner { position: relative; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
.mem-card.flipped .mem-inner { transform: rotateY(180deg); }
.mem-back, .mem-front { position: absolute; inset: 0; border-radius: 2.5vmin; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 .8vmin 0 rgba(0, 0, 0, .18); }
.mem-back { background: linear-gradient(135deg, #7b5cff, #a98bff); color: #fff; font-size: 8vmin; border: .7vmin solid #fff; }
.mem-front { background: #fff; transform: rotateY(180deg); border: .7vmin solid #fff; }
.mem-front .emo { font-size: 11vmin; line-height: 1; }
.mem-front .emo.shadow { filter: brightness(0); opacity: .85; }
.mem-front .num { font-size: 11vmin; color: #2a3f7a; }
.mem-front .dots-svg { width: 80%; height: 80%; }
.mem-card.matched .mem-front { border-color: #35c46b; animation: popin .4s; }

/* Huepfen / Schlitten */
.tap-hint { position: absolute; left: 50%; top: 40%; font-size: 14vmin; animation: tap 1s infinite; pointer-events: none; }
@keyframes tap { 50% { transform: translateY(2vmin) scale(.9); } }
.hud-target { position: absolute; top: 2vmin; right: 3vmin; background: #fff; border-radius: 4vmin; padding: 1vmin 2.5vmin 1vmin 1.5vmin; display: flex; align-items: center; gap: 1vmin; box-shadow: 0 .8vmin 0 #b9cde0; pointer-events: none; }
.hud-target svg { width: 8vmin; height: 8vmin; }
.hud-target .cnt { font-size: 6vmin; }
.steer { position: absolute; bottom: 3vmin; width: 18vmin; height: 18vmin; border-radius: 50%; background: rgba(255, 255, 255, .85); font-size: 9vmin; color: #3d8bfd; box-shadow: 0 1vmin 0 #b9cde0; z-index: 2; }
.steer.left { left: 3vmin; } .steer.right { right: 3vmin; }
.steer:active { transform: scale(.92); }

/* Muster */
.g-muster { background: linear-gradient(#a7f0e4, #e9fffb); }
.chain-wrap { position: absolute; top: 4vmin; left: 0; right: 0; height: 42%; display: flex; align-items: center; justify-content: center; }
.chain { display: flex; gap: 1.6vmin; background: rgba(255, 255, 255, .7); padding: 2.5vmin; border-radius: 4vmin; }
.chain-item { width: min(14vmin, 10vw); height: min(14vmin, 10vw); animation: popin .4s backwards; display: flex; align-items: center; justify-content: center; }
.chain-item svg { width: 100%; height: 100%; }
.chain-item.gap { border: .8vmin dashed #14b8a6; border-radius: 2.5vmin; background: #fff; animation: hint 1.4s ease-in-out infinite; }
.chain-item .q { font-size: 9vmin; color: #14b8a6; }
.chain.wave .chain-item { animation: wavey .6s; }
.chain.wave .chain-item:nth-child(2n) { animation-delay: .1s; }
@keyframes wavey { 50% { transform: translateY(-2.5vmin); } }
.shape-answers { position: absolute; bottom: 6vmin; left: 0; right: 0; }
.shape-card { padding: 2.5vmin; }
.shape-card svg { width: 100%; height: 100%; }

/* Ergebnis */
.result-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vmin; background: radial-gradient(circle, #fff6c9, #ffd9e6 60%, #c9e6ff); }
.res-fluffi { width: 30vmin; z-index: 1; }
.jump { animation: hop 1s ease-in-out infinite; }
.res-stars { display: flex; gap: 3vmin; z-index: 1; }
.res-stars span { font-size: 16vmin; line-height: 1; color: #e3e3ea; transition: all .4s cubic-bezier(.3, 1.8, .5, 1); transform: scale(.7); }
.res-stars span.on { color: #ffc933; transform: scale(1.1); text-shadow: 0 0 3vmin #ffe58a; }
.res-level { display: flex; align-items: center; gap: .8vmin; font-size: 7vmin; z-index: 1; }
.lvl-up { color: #35c46b; animation: bounce 1s infinite; margin-right: 1vmin; }
.res-btns { display: flex; gap: 6vmin; z-index: 1; margin-top: 1vmin; }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -3vmin; width: 1.6vmin; height: 2.6vmin; border-radius: .4vmin; animation: fall linear infinite; }
.overlay { position: absolute; inset: 0; background: rgba(40, 30, 70, .55); z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
.gift-box { font-size: 34vmin; }
.wobble { animation: wobble 1s infinite; }
@keyframes wobble { 25% { transform: rotate(-8deg) scale(1.05); } 75% { transform: rotate(8deg) scale(1.05); } }
.gift-sticker { font-size: 34vmin; background: #fff; border-radius: 6vmin; padding: 2vmin 5vmin; }
.gift-fluffi { width: 44vmin; background: #fff; border-radius: 50%; padding: 4vmin; }
.tap-on { font-size: 9vmin; margin-top: 2vmin; animation: tap 1s infinite; }

/* Kleiderschrank */
.wardrobe-screen { background: linear-gradient(#ffd0e1, #fff2f7); }
.wr-body { position: absolute; top: 17vmin; left: 0; right: 0; bottom: 0; display: flex; gap: 3vmin; padding: 0 3vmin 3vmin; }
.wr-preview { width: 38vmin; flex-shrink: 0; align-self: center; }
.wr-cats { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2vmin; }
.wr-row { display: flex; gap: 1.6vmin; align-items: center; flex-wrap: wrap; }
.wr-cat-ico { font-size: 8vmin; width: 10vmin; text-align: center; }
.wr-item { width: 14vmin; height: 16vmin; background: #fff; border-radius: 3vmin; box-shadow: 0 .8vmin 0 #e7b9cb; padding: 1vmin; position: relative; display: flex; align-items: center; justify-content: center; }
.wr-item svg { width: 100%; height: 100%; }
.wr-item.on { box-shadow: 0 0 0 1vmin #35c46b, 0 .8vmin 0 #e7b9cb; }
.wr-item.locked { background: #eee; }
.wr-item .st-need { bottom: -2vmin; font-size: 3vmin; }
.wr-item .st-lock { position: static; font-size: 6vmin; }

/* Album */
.album-screen { background: linear-gradient(#ffe7b3, #fff8e6); }
.album-grid { position: absolute; top: 17vmin; left: 3vmin; right: 3vmin; bottom: 3vmin; display: grid; grid-template-columns: repeat(auto-fill, minmax(18vmin, 1fr)); gap: 3vmin; align-content: start; overflow-y: auto; padding: 1vmin; }
.sticker { height: 20vmin; background: #fff; border-radius: 4vmin; box-shadow: 0 1vmin 0 #e8cf94; display: flex; align-items: center; justify-content: center; position: relative; border: .8vmin dashed #f2d27c; }
.sticker .st-emoji { font-size: 12vmin; }
.sticker.locked { background: #f6f1e4; }
.sticker .st-q { font-size: 10vmin; color: #d8c79d; }
.sticker .st-need { bottom: -2.6vmin; font-size: 3vmin; }

/* Elternbereich */
.parents-screen { background: #eef3f8; overflow-y: auto; }
.parents-box { max-width: 760px; margin: 3vh auto; background: #fff; border-radius: 16px; padding: 20px 28px; font-weight: 600; font-size: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, .08); }
.parents-box h2 { margin-top: 0; }
.parents-box table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
.parents-box td, .parents-box th { border-bottom: 1px solid #e3e8ee; padding: 6px; text-align: left; }
.parents-box .small { font-size: 13px; color: #667; }
.parents-box button { background: #3d8bfd; color: #fff; border-radius: 10px; padding: 10px 16px; margin: 4px; font-weight: 700; }
.parents-box button.danger { background: #e2557a; }
.tgl { display: block; margin: 8px 0; font-size: 18px; }
.tgl input[type=checkbox] { width: 22px; height: 22px; vertical-align: middle; margin-right: 8px; }
.p-btns { display: flex; justify-content: space-between; flex-wrap: wrap; }

/* Namensabfrage */
.name-screen { display: flex; align-items: center; justify-content: center; gap: 5vmin; }
.name-fluffi { width: 34vmin; z-index: 1; }
.name-box { z-index: 1; background: #fff; border-radius: 5vmin; padding: 3vmin 4vmin; display: flex; flex-direction: column; align-items: center; gap: 2.5vmin; box-shadow: 0 1.2vmin 0 #b9cde0; max-width: 56vw; }
.name-q { font-size: 9vmin; }
.name-input { font: inherit; font-size: 6vmin; width: 46vmin; max-width: 50vw; text-align: center; border: .6vmin solid #9cc7e8; border-radius: 3vmin; padding: 1.2vmin 2vmin; color: #3b3650; user-select: text; -webkit-user-select: text; }
.name-input:focus { outline: none; border-color: #3d8bfd; }
.name-btns { display: flex; gap: 4vmin; align-items: center; }
.name-ok { background: #c9f7d8; }
.name-hint { margin: 0; font-size: 2.4vmin; font-weight: 600; color: #778; text-align: center; }
.parents-box input[type=text] { font: inherit; font-size: 18px; width: 220px; padding: 6px 10px; border: 2px solid #c9d6e3; border-radius: 8px; margin-left: 8px; }

/* Versionshinweis und App-Info */
.version-tag { position: absolute; right: 2vmin; bottom: 1.6vmin; z-index: 2; font-size: 2.6vmin; font-weight: 700; color: #4f6f8f; background: rgba(255, 255, 255, .7); border-radius: 3vmin; padding: .8vmin 2vmin; }
.info-overlay { cursor: default; }

<script>
/* ==== js/core.js ==== */
/* Fluffi – Kern: Namensraum, Zufall, Spielstand, Stufenlogik, Ton, Sprache.
   Beim Laden wird kein DOM angefasst, damit die Tests die Logik in Node laden koennen. */
var F = (typeof window !== 'undefined' ? window : globalThis).F = {};
F.VERSION = '0.3.0';
F.BUILD_DATE = '21.11.2026 17:06';   // wird von tools/build.mjs ersetzt
F.APP_INFO = {
  name: 'Fluffis Abenteuer',
  idea: 'M.G.',
  ideaRoles: 'Idee, Konzeptvorgaben, Architektur-Anforderungen, Test und Abnahme',
  developer: 'KI Claude Opus 5.5 (Anthropic)',   // bei Modellwechsel anpassen (AGENTS.md)
  developerRoles: 'Recherche, Spielkonzept, Programmierung, Grafik, Tests, Dokumentation'
};
F.buildDate = function () { return /^__/.test(F.BUILD_DATE) ? 'Entwicklungsstand' : F.BUILD_DATE; };
F.MAX_LEVEL = 6;
F.games = {};
F.gameOrder = [];
F.gen = {};   // reine Aufgaben-Generatoren (testbar)

F.registerGame = function (def) {
  F.games[def.id] = def;
  F.gameOrder.push(def.id);
};

/* ---------- Zufall (seedbar, fuer Tests reproduzierbar) ---------- */
F.makeRng = function (seed) {
  var a = (seed >>> 0) || 1;
  function next() {
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  var r = {
    next: next,
    int: function (min, max) { return min + Math.floor(next() * (max - min + 1)); },
    pick: function (arr) { return arr[Math.floor(next() * arr.length)]; },
    shuffle: function (arr) {
      var b = arr.slice();
      for (var i = b.length - 1; i > 0; i--) {
        var j = Math.floor(next() * (i + 1));
        var t = b[i]; b[i] = b[j]; b[j] = t;
      }
      return b;
    },
    sample: function (arr, n) { return r.shuffle(arr).slice(0, n); },
    chance: function (p) { return next() < p; }
  };
  return r;
};
F.rng = F.makeRng((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);

/* ---------- Zahlwoerter ---------- */
F.NUM_WORDS = ['null', 'eins', 'zwei', 'drei', 'vier', 'fünf', 'sechs', 'sieben', 'acht', 'neun', 'zehn'];
F.numWord = function (n) { return F.NUM_WORDS[n] || String(n); };
/* "einen Fisch" / "drei Fische" */
F.countPhrase = function (n, sing, plur, singArticle) {
  if (n === 1) return (singArticle || 'einen') + ' ' + sing;
  return F.numWord(n) + ' ' + plur;
};

/* Antwortmoeglichkeiten rund um die richtige Zahl, alle verschieden, im Bereich */
F.gen.numberOptions = function (rng, answer, min, max, count) {
  count = count || 3;
  var opts = [answer];
  var deltas = rng.shuffle([-1, 1, -2, 2, -3, 3]);
  for (var i = 0; i < deltas.length && opts.length < count; i++) {
    var v = answer + deltas[i];
    if (v >= min && v <= max && opts.indexOf(v) < 0) opts.push(v);
  }
  for (var v2 = min; opts.length < count && v2 <= max; v2++) if (opts.indexOf(v2) < 0) opts.push(v2);
  return rng.shuffle(opts);
};

/* ---------- Spielstand ---------- */
F.defaultState = function () {
  return {
    v: 1,
    stars: 0,
    levels: {},       // spielId -> Stufe 1..6
    plays: {},        // spielId -> Anzahl Durchgaenge
    best: {},         // spielId -> beste Sternzahl
    goodStreak: {},   // aufeinanderfolgende 2-Sterne-Durchgaenge
    lowStreak: {},    // aufeinanderfolgende 1-Stern-Durchgaenge
    childName: '',    // Vorname des Kindes (nur lokal), leer = ohne Namen
    askedName: false, // Namensabfrage schon gezeigt
    unlocked: ['bow_pink'],
    outfit: { bow: 'bow_pink', hat: null, scarf: null, glasses: null },
    settings: { speech: true, sound: true, voiceMode: 'auto' }
  };
};

F.mergeState = function (s) {
  var d = F.defaultState();
  if (!s || typeof s !== 'object' || s.v !== 1) return d;
  Object.keys(d).forEach(function (k) {
    if (s[k] === undefined || s[k] === null || typeof s[k] !== typeof d[k]) s[k] = d[k];
  });
  Object.keys(d.settings).forEach(function (k) { if (typeof s.settings[k] !== typeof d.settings[k]) s.settings[k] = d.settings[k]; });
  if (['auto', 'clips', 'browser'].indexOf(s.settings.voiceMode) < 0) s.settings.voiceMode = 'auto';
  Object.keys(d.outfit).forEach(function (k) { if (!(k in s.outfit)) s.outfit[k] = d.outfit[k]; });
  if (!Array.isArray(s.unlocked)) s.unlocked = d.unlocked.slice();
  s.childName = F.cleanName(s.childName);
  if (typeof s.stars !== 'number' || s.stars < 0 || !isFinite(s.stars)) s.stars = 0;
  return s;
};

F.store = {
  key: 'fluffi.v1',
  load: function () {
    try {
      var raw = localStorage.getItem(this.key);
      if (raw) return F.mergeState(JSON.parse(raw));
    } catch (e) { /* defekter oder gesperrter Speicher -> Neustart */ }
    return F.defaultState();
  },
  save: function (st) {
    try { localStorage.setItem(this.key, JSON.stringify(st)); } catch (e) { /* Speicher voll/gesperrt */ }
  },
  reset: function () {
    try { localStorage.removeItem(this.key); } catch (e) { }
  }
};

/* ---------- Bewertung und Stufen ---------- */
/* Sterne aus Fehlern je Aufgabe: immer mindestens 1 Stern. */
F.starsFor = function (mistakes, tasks) {
  var ratio = mistakes / Math.max(1, tasks);
  if (ratio <= 0.2) return 3;
  if (ratio <= 0.6) return 2;
  return 1;
};

F.applyResult = function (state, gameId, stars) {
  stars = Math.max(1, Math.min(3, stars | 0));
  var lvl = state.levels[gameId] || 1;
  var good = state.goodStreak[gameId] || 0;
  var low = state.lowStreak[gameId] || 0;
  var change = 0;
  state.plays[gameId] = (state.plays[gameId] || 0) + 1;
  state.best[gameId] = Math.max(state.best[gameId] || 0, stars);
  state.stars += stars;

  if (stars === 3) { good = 0; low = 0; if (lvl < F.MAX_LEVEL) { lvl++; change = 1; } }
  else if (stars === 2) { low = 0; good++; if (good >= 2) { good = 0; if (lvl < F.MAX_LEVEL) { lvl++; change = 1; } } }
  else { good = 0; low++; if (low >= 2) { low = 0; if (lvl > 1) { lvl--; change = -1; } } }

  state.levels[gameId] = lvl;
  state.goodStreak[gameId] = good;
  state.lowStreak[gameId] = low;
  var newRewards = F.rewards ? F.rewards.checkUnlocks(state) : [];
  return { level: lvl, change: change, stars: stars, newRewards: newRewards };
};

F.isGameUnlocked = function (state, gameId) {
  var g = F.games[gameId];
  return !!g && state.stars >= (g.unlockAt || 0);
};

/* ---------- Toene (WebAudio, ohne Dateien) ---------- */
F.sound = {
  ctx: null,
  ensure: function () {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; }
    return this.ctx;
  },
  tone: function (freq, dur, type, delay, vol, slideTo) {
    var c = this.ctx;
    if (!c) return;
    var t0 = c.currentTime + (delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  play: function (name) {
    if (!F.state || !F.state.settings.sound) return;
    if (!this.ensure()) return;
    var s = this;
    switch (name) {
      case 'tap': s.tone(660, 0.08, 'triangle', 0, 0.12); break;
      case 'pop': s.tone(520, 0.12, 'sine', 0, 0.2, 980); break;
      case 'good': [523, 659, 784].forEach(function (f, i) { s.tone(f, 0.18, 'triangle', i * 0.09, 0.18); }); break;
      case 'wrong': s.tone(300, 0.18, 'sine', 0, 0.14, 220); s.tone(240, 0.22, 'sine', 0.16, 0.12, 180); break;
      case 'jump': s.tone(400, 0.2, 'square', 0, 0.06, 800); break;
      case 'bump': s.tone(140, 0.25, 'sawtooth', 0, 0.1, 70); break;
      case 'star': [988, 1319, 1568].forEach(function (f, i) { s.tone(f, 0.15, 'sine', i * 0.06, 0.12); }); break;
      case 'win': [523, 659, 784, 1047, 784, 1047].forEach(function (f, i) { s.tone(f, 0.22, 'triangle', i * 0.12, 0.18); }); break;
      case 'gift': [784, 988, 1175, 1568].forEach(function (f, i) { s.tone(f, 0.3, 'sine', i * 0.1, 0.16); }); break;
    }
  }
};

/* ---------- Sprachausgabe ----------
   Zwei Wege:
   1. Aufnahmen (F.voice): vorab erzeugte Ansagen (src/js/voice-data.js), Wiedergabe ueber WebAudio wie die Toene.
      Funktioniert auch dort, wo der Browser keine Sprachsynthese hat (Silk auf dem Fire-Tablet).
   2. Browser-Stimme (Web Speech API, de-DE): kann auch den Namen des Kindes sprechen.
   Einstellung settings.voiceMode: 'auto' (Aufnahmen, wenn vorhanden, sonst Browser) | 'clips' | 'browser'. */
F.speech = {
  supported: false,
  voice: null,
  voices: [],
  lastText: '',
  init: function () {
    this.supported = typeof window !== 'undefined' && 'speechSynthesis' in window &&
      typeof window.SpeechSynthesisUtterance !== 'undefined';
    if (!this.supported) return;
    var self = this;
    var pick = function () {
      var vs = window.speechSynthesis.getVoices() || [];
      self.voices = vs;
      var de = vs.filter(function (v) { return /^de([-_]|$)/i.test(v.lang); });
      self.voice = de.filter(function (v) { return /female|frau|anna|katja|hedda|petra|vicki|marlene|google/i.test(v.name); })[0] || de[0] || null;
    };
    pick();
    if ('onvoiceschanged' in window.speechSynthesis) window.speechSynthesis.onvoiceschanged = pick;
  },
  /* welcher Weg wird genutzt? 'clips' | 'browser' | 'none' */
  route: function () {
    var mode = (F.state && F.state.settings.voiceMode) || 'auto';
    var clips = F.voice && F.voice.has();
    if (mode === 'clips') return clips ? 'clips' : 'none';
    if (mode === 'browser') return this.supported ? 'browser' : (clips ? 'clips' : 'none');
    if (clips) return 'clips';
    return this.supported ? 'browser' : 'none';
  },
  /* Liefert ein Promise, das nach dem Sprechen (oder spaetestens nach einer Schaetzzeit) erfuellt ist. */
  say: function (text, opts) {
    opts = opts || {};
    if (!opts.noRepeat) this.lastText = text;
    if (F.ui && F.ui.bubble) F.ui.bubble(text);
    if (typeof window !== 'undefined' && window.__said) window.__said.push(text);
    var est = 700 + text.length * 75;
    var route = F.state && F.state.settings.speech ? this.route() : 'none';
    if (route === 'clips') {
      this.stopBrowser();
      var p = F.voice.say(text);
      return Promise.race([p, F.wait(est + 6000)]);
    }
    if (route === 'none') {
      return new Promise(function (res) { setTimeout(res, opts.silentWait === false ? 0 : Math.min(est, 1500)); });
    }
    if (F.voice) F.voice.stop();
    var self = this;
    return new Promise(function (res) {
      var done = false;
      var fin = function () { if (!done) { done = true; res(); } };
      try {
        window.speechSynthesis.cancel();
        var u = new window.SpeechSynthesisUtterance(text);
        u.lang = 'de-DE';
        if (self.voice) u.voice = self.voice;
        u.rate = opts.rate || 0.92;
        u.pitch = 1.2;
        u.onend = fin; u.onerror = fin;
        // Chromium-Android verschluckt manchmal speak() direkt nach cancel()
        setTimeout(function () { window.speechSynthesis.speak(u); }, 60);
      } catch (e) { fin(); }
      setTimeout(fin, est + 2500);
    });
  },
  repeat: function () { if (this.lastText) return this.say(this.lastText); return Promise.resolve(); },
  stopBrowser: function () { if (this.supported) { try { window.speechSynthesis.cancel(); } catch (e) { } } },
  stop: function () { this.stopBrowser(); if (F.voice) F.voice.stop(); }
};

/* Kleine Helfer */
F.wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
/* Vorname bereinigen: nur Buchstaben, Leerzeichen, Bindestrich; max. 20 Zeichen */
F.cleanName = function (n) {
  if (typeof n !== 'string') return '';
  return n.replace(/[^A-Za-zÀ-ÖØ-öø-ÿĀ-žß \-]/g, '').replace(/\s+/g, ' ').trim().slice(0, 20);
};
F.childName = function () { return (F.state && F.state.childName) || ''; };
/* ", Lena" oder "" – fuer Saetze wie "Hallo, Lena!" */
F.nameComma = function () { var n = F.childName(); return n ? ', ' + n : ''; };
F.PRAISE = ['Super!', 'Toll gemacht!', 'Prima!', 'Klasse!', 'Juhu, richtig!', 'Spitze!', 'Wunderbar!'];
F.PRAISE_NAME = ['Super', 'Toll gemacht', 'Klasse', 'Prima'];   // + ", Name!"
F.RETRY = ['Versuch es nochmal!', 'Hmm, schau nochmal genau.', 'Fast! Probier es nochmal.'];
F.pickPraise = function (rng) {
  rng = rng || F.rng;
  var n = F.childName();
  if (n && rng.chance(0.35)) return rng.pick(F.PRAISE_NAME) + ', ' + n + '!';
  return rng.pick(F.PRAISE);
};
F.pickRetry = function (rng) { return (rng || F.rng).pick(F.RETRY); };

/* ==== js/voice.js ==== */
/* Aufgenommene Ansagen: Wiedergabe ueber WebAudio (gleicher Weg wie die Toene, funktioniert in Silk).
   Daten: F.VOICE = { voice, rate, clips: { schluessel: base64-MP3 } } aus src/js/voice-data.js (generiert von tools/voice/).
   Ein Text wird in Saetze zerlegt; jeder Satz wird ueber einen normalisierten Schluessel gesucht.
   Saetze mit dem Kindernamen werden ohne den Namen gesucht ("Super, Mia!" -> "Super!"). */
F.voice = {
  buffers: {},
  missing: {},
  token: 0,
  current: null,

  has: function () { return !!(F.VOICE && F.VOICE.clips && Object.keys(F.VOICE.clips).length); },
  count: function () { return F.VOICE && F.VOICE.clips ? Object.keys(F.VOICE.clips).length : 0; },

  key: function (s) {
    return String(s).toLowerCase().replace(/[.,!?:;„“"()…]/g, ' ').replace(/\s+/g, ' ').trim();
  },
  sentences: function (text) {
    return String(text).split(/(?<=[.!?])\s+/).map(function (x) { return x.trim(); }).filter(Boolean);
  },
  stripName: function (sentence) {
    var n = F.childName();
    if (!n) return sentence;
    var esc = n.replace(/[-\s]/g, function (c) { return c === '-' ? '\\-' : '\\s'; });
    return sentence.replace(new RegExp(',?\\s*' + esc + '(?=[\\s,.!?]|$)', 'g'), '');
  },
  resolve: function (sentence) {
    var clips = (F.VOICE && F.VOICE.clips) || {};
    var k = this.key(sentence);
    if (clips[k]) return k;
    k = this.key(this.stripName(sentence));
    if (k && clips[k]) return k;
    return null;
  },
  decode: function (k) {
    var self = this;
    if (this.buffers[k]) return Promise.resolve(this.buffers[k]);
    var ctx = F.sound.ensure();
    if (!ctx) return Promise.reject(new Error('kein AudioContext'));
    var bin = atob(F.VOICE.clips[k]);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Promise(function (res, rej) {
      var p = ctx.decodeAudioData(arr.buffer, function (buf) { self.buffers[k] = buf; res(buf); }, rej);
      if (p && p.catch) p.catch(rej);
    });
  },
  playBuffer: function (buf) {
    var self = this;
    var ctx = F.sound.ctx;
    return new Promise(function (res) {
      var src = ctx.createBufferSource();
      src.buffer = buf;
      src.playbackRate.value = (F.VOICE && F.VOICE.rate) || 1;
      src.connect(ctx.destination);
      var done = false;
      var fin = function () { if (!done) { done = true; res(); } };
      src.onended = fin;
      self.current = src;
      src.start();
      setTimeout(fin, (buf.duration / src.playbackRate.value) * 1000 + 400);
    });
  },
  say: async function (text) {
    var my = ++this.token;
    this.stopCurrent();
    var parts = this.sentences(text);
    for (var i = 0; i < parts.length; i++) {
      if (my !== this.token) return;
      var k = this.resolve(parts[i]);
      if (!k) { this.missing[parts[i]] = 1; continue; }
      var buf;
      try { buf = await this.decode(k); } catch (e) { continue; }
      if (my !== this.token) return;
      await this.playBuffer(buf);
      if (i < parts.length - 1) await F.wait(120);
    }
  },
  /* Haeufige Ansagen vorab dekodieren, damit die erste Ansage nicht stockt */
  warmup: function (texts) {
    var self = this;
    texts.forEach(function (t) { self.sentences(t).forEach(function (s) { var k = self.resolve(s); if (k) self.decode(k).catch(function () { }); }); });
  },
  stopCurrent: function () { if (this.current) { try { this.current.stop(); } catch (e) { } this.current = null; } },
  stop: function () { this.token++; this.stopCurrent(); }
};

/* ==== js/voice-data.js ==== */
/* GENERIERT von tools/voice/generate.py – nicht von Hand bearbeiten.
   Noch keine Aufnahmen erzeugt (Freigabe fuer TTS-Werkzeug ausstehend, siehe .agentic/DECISIONS/D-003). */
F.VOICE = { voice: null, rate: 1, generated: null, clips: {} };

    { id: 'st_trophy', type: 'sticker', name: 'Pokal', emoji: '🏆', at: 105 }
  ],
  byId: {},
  checkUnlocks: function (state) {
    var newly = [];
    this.items.forEach(function (it) {
      if (it.at <= state.stars && state.unlocked.indexOf(it.id) < 0) {
        state.unlocked.push(it.id);
        newly.push(it);
      }
    });
    return newly;
  },
  next: function (state) {
    for (var i = 0; i < this.items.length; i++) {
      if (state.unlocked.indexOf(this.items[i].id) < 0) return this.items[i];
    }
    return null;
  }
};
F.rewards.items.forEach(function (it) { F.rewards.byId[it.id] = it; });

/* ==== js/fluffi.js ==== */
/* Fluffi als Comic-SVG (nach dem Kuscheltier-Foto: lavendelgrau, weisses Herzgesicht und Bauch,
   gelber Schnabel und Fuesse, schwarze Knopfaugen, rosa Schleife rechts oben) plus kleine Grafik-Helfer. */
F.art = {};

F.art.COL = {
  grey: '#bcb8cc', greyDark: '#a29db6', white: '#fdfcf8', line: '#4e4a5e',
  yellow: '#ffd23f', yellowDark: '#e8b100', cheek: '#ff9db5', eye: '#22202b'
};

/* outfit: {bow, hat, scarf, glasses}  mood: 'normal' | 'happy' | 'wow' */
F.art.fluffi = function (outfit, mood, extraClass) {
  outfit = outfit || {};
  var C = F.art.COL;
  var R = F.rewards ? F.rewards.byId : {};
  var bow = R[outfit.bow], hat = R[outfit.hat], scarf = R[outfit.scarf], glasses = R[outfit.glasses];
  var s = '';
  s += '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" class="fluffi ' + (extraClass || '') + '">';
  // Fuesse
  s += '<g stroke="' + C.line + '" stroke-width="3" stroke-linejoin="round">';
  s += '<path class="f-foot" d="M58 226 q-4 -16 14 -20 q20 -2 22 14 q2 12 -18 12 q-14 0 -18 -6z" fill="' + C.yellow + '"/>';
  s += '<path class="f-foot" d="M142 226 q4 -16 -14 -20 q-20 -2 -22 14 q-2 12 18 12 q14 0 18 -6z" fill="' + C.yellow + '"/>';
  // Fluegel
  s += '<path class="f-wing-l" d="M36 128 q-30 8 -28 34 q14 2 32 -12z" fill="' + C.greyDark + '"/>';
  s += '<path class="f-wing-r" d="M164 128 q30 8 28 34 q-14 2 -32 -12z" fill="' + C.greyDark + '"/>';
  // Koerper (Kopf und Rumpf ein Stueck wie beim Kuscheltier)
  s += '<path d="M100 22 C 150 22 172 70 170 120 C 168 180 150 222 100 222 C 50 222 32 180 30 120 C 28 70 50 22 100 22 Z" fill="' + C.grey + '"/>';
  // Bauch
  s += '<path d="M100 120 C 140 120 152 150 150 180 C 148 208 128 218 100 218 C 72 218 52 208 50 180 C 48 150 60 120 100 120 Z" fill="' + C.white + '" stroke="none"/>';
  // Gesicht (Herzform mit grauer Spitze in der Mitte)
  s += '<path d="M100 66 C 90 40 46 40 42 80 C 38 118 70 132 100 130 C 130 132 162 118 158 80 C 154 40 110 40 100 66 Z" fill="' + C.white + '"/>';
  s += '</g>';
  // Augen
  if (mood === 'happy') {
    s += '<path d="M66 88 q10 -12 20 0" fill="none" stroke="' + C.eye + '" stroke-width="5" stroke-linecap="round"/>';
    s += '<path d="M114 88 q10 -12 20 0" fill="none" stroke="' + C.eye + '" stroke-width="5" stroke-linecap="round"/>';
  } else {
    var r = mood === 'wow' ? 11 : 9.5;
    s += '<g class="f-eyes"><circle cx="76" cy="88" r="' + r + '" fill="' + C.eye + '"/><circle cx="124" cy="88" r="' + r + '" fill="' + C.eye + '"/>';
    s += '<circle cx="72.5" cy="84" r="3.6" fill="#fff"/><circle cx="120.5" cy="84" r="3.6" fill="#fff"/>';
    s += '<circle cx="79" cy="92" r="1.6" fill="#fff"/><circle cx="127" cy="92" r="1.6" fill="#fff"/></g>';
  }
  // Baeckchen
  s += '<ellipse cx="62" cy="106" rx="9" ry="5.5" fill="' + C.cheek + '" opacity=".55"/>';
  s += '<ellipse cx="138" cy="106" rx="9" ry="5.5" fill="' + C.cheek + '" opacity=".55"/>';
  // Schnabel
  if (mood === 'wow') {
    s += '<path d="M86 100 Q100 94 114 100 Q110 118 100 118 Q90 118 86 100 Z" fill="' + C.yellow + '" stroke="' + C.line + '" stroke-width="3" stroke-linejoin="round"/>';
    s += '<ellipse cx="100" cy="108" rx="6" ry="4" fill="#d9534f"/>';
  } else {
    s += '<path d="M84 100 Q100 93 116 100 Q106 114 100 114 Q94 114 84 100 Z" fill="' + C.yellow + '" stroke="' + C.line + '" stroke-width="3" stroke-linejoin="round"/>';
    s += '<path d="M90 101 Q100 98 110 101" fill="none" stroke="' + C.yellowDark + '" stroke-width="2" stroke-linecap="round"/>';
  }
  if (scarf) s += F.art.scarf(scarf);
  if (glasses) s += F.art.glasses(glasses);
  if (hat) s += F.art.hat(hat);
  if (bow) s += F.art.bow(bow.color, bow.color2);
  s += '</svg>';
  return s;
};

F.art.bow = function (col, col2) {
  var L = F.art.COL.line;
  var c2 = col2 || col;
  return '<g transform="translate(134 30) rotate(18)" stroke="' + L + '" stroke-width="3" stroke-linejoin="round">' +
    '<path d="M0 0 C -14 -22 -38 -14 -34 2 C -32 16 -14 14 0 0 Z" fill="' + col + '"/>' +
    '<path d="M0 0 C 14 -22 38 -14 34 2 C 32 16 14 14 0 0 Z" fill="' + c2 + '"/>' +
    '<path d="M-22 -4 q8 2 14 2 M22 -4 q-8 2 -14 2" fill="none" stroke-width="2" opacity=".5"/>' +
    '<ellipse cx="0" cy="0" rx="7" ry="8" fill="' + col + '"/></g>';
};

F.art.hat = function (h) {
  var L = F.art.COL.line;
  var g = '<g stroke="' + L + '" stroke-width="3" stroke-linejoin="round">';
  switch (h.style) {
    case 'wool':
      g += '<path d="M48 52 C 52 10 148 10 152 52 Z" fill="' + h.color + '"/>';
      g += '<rect x="42" y="44" width="116" height="18" rx="9" fill="' + (h.color2 || '#fff') + '"/>';
      g += '<circle cx="100" cy="12" r="12" fill="' + (h.color2 || '#fff') + '"/>';
      break;
    case 'crown':
      g += '<path d="M62 50 L58 14 L80 32 L100 6 L120 32 L142 14 L138 50 Z" fill="#ffcc33"/>';
      g += '<circle cx="100" cy="36" r="5" fill="#e53950"/><circle cx="78" cy="40" r="4" fill="#3a8ee6"/><circle cx="122" cy="40" r="4" fill="#3ec46d"/>';
      break;
    case 'party':
      g += '<path d="M76 46 L100 -6 L124 46 Z" fill="' + h.color + '"/>';
      g += '<path d="M84 30 L116 30 M90 16 L110 16" stroke="#fff" stroke-width="5"/>';
      g += '<circle cx="100" cy="-6" r="7" fill="#ffd23f"/>';
      break;
    case 'pirate':
      g += '<path d="M40 50 C 50 4 150 4 160 50 C 130 40 70 40 40 50 Z" fill="#2b2b38"/>';
      g += '<circle cx="100" cy="28" r="7" fill="#fff"/><path d="M92 38 L108 44 M108 38 L92 44" stroke="#fff" stroke-width="3"/>';
      break;
    case 'flower':
      g += '<g transform="translate(66 34)">';
      for (var i = 0; i < 5; i++) g += '<ellipse cx="0" cy="-12" rx="7" ry="11" fill="' + h.color + '" transform="rotate(' + (i * 72) + ')"/>';
      g += '<circle r="7" fill="#ffd23f"/></g>';
      break;
  }
  return g + '</g>';
};

F.art.scarf = function (sc) {
  var L = F.art.COL.line;
  var fill = sc.color;
  var defs = '';
  if (sc.style === 'rainbow') {
    defs = '<defs><linearGradient id="rb" x1="0" x2="1"><stop offset="0" stop-color="#ff5d5d"/><stop offset=".25" stop-color="#ffb347"/><stop offset=".5" stop-color="#ffe066"/><stop offset=".75" stop-color="#6fd36f"/><stop offset="1" stop-color="#6aa8ff"/></linearGradient></defs>';
    fill = 'url(#rb)';
  }
  return defs + '<g stroke="' + L + '" stroke-width="3" stroke-linejoin="round">' +
    '<path d="M40 126 C 70 144 130 144 160 126 L 162 142 C 130 160 70 160 38 142 Z" fill="' + fill + '"/>' +
    '<path d="M124 146 L 140 190 L 120 192 L 110 150 Z" fill="' + fill + '"/>' +
    (sc.style === 'dots' ? '<circle cx="70" cy="142" r="3" fill="#fff" stroke="none"/><circle cx="100" cy="147" r="3" fill="#fff" stroke="none"/><circle cx="130" cy="142" r="3" fill="#fff" stroke="none"/>' : '') +
    '</g>';
};

F.art.glasses = function (gl) {
  var L = F.art.COL.line;
  if (gl.style === 'heart') {
    var heart = function (cx) {
      return '<path d="M' + cx + ' 98 C ' + (cx - 22) + ' 84 ' + (cx - 18) + ' 68 ' + cx + ' 78 C ' + (cx + 18) + ' 68 ' + (cx + 22) + ' 84 ' + cx + ' 98 Z" fill="' + gl.color + '" opacity=".9"/>';
    };
    return '<g stroke="' + L + '" stroke-width="3">' + heart(76) + heart(124) + '<path d="M92 84 L108 84" fill="none"/></g>';
  }
  return '<g stroke="' + L + '" stroke-width="3"><rect x="56" y="76" width="38" height="24" rx="10" fill="' + gl.color + '"/>' +
    '<rect x="106" y="76" width="38" height="24" rx="10" fill="' + gl.color + '"/><path d="M94 86 L106 86" fill="none"/>' +
    '<path d="M62 82 l10 0" stroke="#fff" stroke-width="3" opacity=".6"/><path d="M112 82 l10 0" stroke="#fff" stroke-width="3" opacity=".6"/></g>';
};

/* Fisch (schaut nach rechts) */
F.art.fish = function (color) {
  var L = F.art.COL.line;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" class="fish-svg">' +
    '<g stroke="' + L + '" stroke-width="3" stroke-linejoin="round">' +
    '<path d="M18 30 L2 12 L4 48 Z" fill="' + color + '"/>' +
    '<ellipse cx="52" cy="30" rx="38" ry="22" fill="' + color + '"/>' +
    '<path d="M44 10 q10 -10 22 0" fill="' + color + '"/></g>' +
    '<path d="M40 14 q-6 16 0 32" fill="none" stroke="#fff" stroke-width="3" opacity=".5"/>' +
    '<circle cx="74" cy="25" r="6" fill="#fff" stroke="' + L + '" stroke-width="2"/><circle cx="76" cy="25" r="3" fill="#222"/>' +
    '<path d="M84 36 q4 2 6 0" fill="none" stroke="' + L + '" stroke-width="2" stroke-linecap="round"/></svg>';
};

/* Formen fuer Muster-Kette */
F.art.SHAPES = {
  circle: '<circle cx="50" cy="50" r="38"/>',
  square: '<rect x="14" y="14" width="72" height="72" rx="8"/>',
  triangle: '<path d="M50 10 L90 86 L10 86 Z"/>',
  heart: '<path d="M50 88 C 6 60 8 22 30 16 C 42 12 50 22 50 30 C 50 22 58 12 70 16 C 92 22 94 60 50 88 Z"/>',
  star: '<path d="M50 6 L61 37 L94 38 L68 58 L77 90 L50 71 L23 90 L32 58 L6 38 L39 37 Z"/>'
};
F.art.shape = function (shape, color, size) {
  var k = size === 'small' ? 0.62 : 1;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="shape-svg">' +
    '<g transform="translate(50 50) scale(' + k + ') translate(-50 -50)" fill="' + color + '" stroke="' + F.art.COL.line + '" stroke-width="5" stroke-linejoin="round">' +
    F.art.SHAPES[shape] + '</g></svg>';
};

/* Wuerfelpunkte 1..10 als SVG */
F.art.dots = function (n, color) {
  var pos = {
    1: [[50, 50]], 2: [[30, 30], [70, 70]], 3: [[25, 25], [50, 50], [75, 75]],
    4: [[30, 30], [70, 30], [30, 70], [70, 70]], 5: [[28, 28], [72, 28], [50, 50], [28, 72], [72, 72]],
    6: [[30, 22], [70, 22], [30, 50], [70, 50], [30, 78], [70, 78]],
    7: [[30, 22], [70, 22], [30, 50], [50, 50], [70, 50], [30, 78], [70, 78]],
    8: [[30, 18], [70, 18], [30, 41], [70, 41], [30, 64], [70, 64], [30, 87], [70, 87]],
    9: [[22, 22], [50, 22], [78, 22], [22, 50], [50, 50], [78, 50], [22, 78], [50, 78], [78, 78]],
    10: [[20, 25], [35, 25], [50, 25], [65, 25], [80, 25], [20, 70], [35, 70], [50, 70], [65, 70], [80, 70]]
  }[n] || [];
  var r = n > 6 ? 7 : 10;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="dots-svg">' +
    pos.map(function (p) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + r + '" fill="' + (color || '#2a3f7a') + '"/>'; }).join('') + '</svg>';
};

/* SVG -> Image fuer Canvas-Spiele */
F.art.toImage = function (svg) {
  var img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  return img;
};

/* ==== js/ui.js ==== */
/* Bildschirme: Start, Karte, Spielrahmen, Ergebnis, Kleiderschrank, Album, Elternbereich */
F.ui = {};

F.el = function (tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
};

/* Tippen: pointerup statt click (schneller auf Tablets), mit Ton */
F.onTap = function (el, fn, silent) {
  el.addEventListener('click', function (ev) {
    ev.preventDefault();
    if (!silent) F.sound.play('tap');
    fn(ev);
  });
  return el;
};

F.show = function (builder) {
  if (F.current && F.current.destroy) { try { F.current.destroy(); } catch (e) { console.error(e); } }
  F.speech.stop();
  F.app.innerHTML = '';
  var scr = F.el('div', 'screen');
  F.app.appendChild(scr);
  var token = {};
  F.currentToken = token;
  F.current = builder(scr, token) || {};
};

/* Sprechblase (fuer Eltern lesbar, Kind hoert die Sprache) */
F.ui.bubble = function (text) {
  var b = document.getElementById('bubble');
  if (!b) return;
  b.textContent = text;
  b.classList.add('show');
  clearTimeout(F.ui._bubbleT);
  F.ui._bubbleT = setTimeout(function () { b.classList.remove('show'); }, 1800 + text.length * 60);
};

F.ui.starRow = function (n, max) {
  var s = '';
  for (var i = 0; i < (max || 3); i++) s += '<span class="mini-star ' + (i < n ? 'on' : '') + '">★</span>';
  return s;
};

/* ---------- Start ---------- */
F.ui.start = function () {
  F.show(function (scr) {
    scr.classList.add('start-screen');
    scr.innerHTML =
      '<div class="snow"></div>' +
      '<h1 class="title">Fluffis Abenteuer</h1>' +
      '<div class="start-fluffi bounce">' + F.art.fluffi(F.state.outfit, 'normal') + '</div>' +
      '<button class="big-play" aria-label="Spielen">▶</button>' +
      '<button class="version-tag" aria-label="App-Info">ℹ️ Version ' + F.VERSION + ' · ' + F.buildDate() + '</button>';
    F.ui.snow(scr.querySelector('.snow'), 24);
    F.onTap(scr.querySelector('.version-tag'), function () { F.ui.appInfo(scr); });
    var go = function () {
      F.sound.ensure();
      F.sound.play('pop');
      F.voice.warmup(['Hallo! Ich bin Fluffi. Wie heißt du?', 'Hallo, da bist du ja wieder! Tippe auf ein Bild.', 'Super! Toll gemacht! Versuch es nochmal!']);
      var de = document.documentElement;
      var rfs = de.requestFullscreen || de.webkitRequestFullscreen;
      if (rfs) { try { var p = rfs.call(de); if (p && p.catch) p.catch(function () { }); } catch (e) { } }
      if (!F.state.askedName) F.ui.askName(); else F.ui.hub(true);
    };
    F.onTap(scr.querySelector('.big-play'), go, true);
    F.onTap(scr.querySelector('.start-fluffi'), go, true);
  });
};

F.ui.snow = function (el, n) {
  var h = '';
  for (var i = 0; i < n; i++) {
    h += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;animation-delay:-' + (Math.random() * 10).toFixed(1) +
      's;animation-duration:' + (7 + Math.random() * 6).toFixed(1) + 's;font-size:' + (10 + Math.random() * 16).toFixed(0) + 'px">❄</i>';
  }
  el.innerHTML = h;
};

/* ---------- Karte ---------- */
F.ui.STATION_POS = [[24, 66], [42, 36], [58, 70], [74, 34], [88, 66]];

F.ui.hub = function (greet) {
  F.show(function (scr, token) {
    scr.classList.add('hub-screen');
    var st = F.state;
    var html = '<div class="snow"></div>' +
      '<svg class="hub-island" viewBox="0 0 100 60" preserveAspectRatio="none"><path d="M0 26 C 15 18 30 24 45 20 C 62 15 80 22 100 17 L100 60 L0 60 Z" fill="#eef7ff"/><path d="M0 34 C 20 28 40 34 60 29 C 75 26 88 30 100 27 L100 60 L0 60 Z" fill="#dcefff"/></svg>' +
      '<div class="topbar">' +
      '<div class="star-count"><span class="big-star">★</span><span class="num">' + st.stars + '</span></div>' +
      '<div class="next-gift"></div>' +
      '<div class="top-btns"><button class="round-btn wardrobe-btn" aria-label="Kleiderschrank">🎀</button>' +
      '<button class="round-btn album-btn" aria-label="Sticker-Album">📒</button>' +
      '<button class="round-btn parent-btn" aria-label="Eltern">⚙<svg class="hold-ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17"/></svg></button></div>' +
      '</div>' +
      '<svg class="hub-path" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="' + F.ui.pathD() + '"/></svg>' +
      '<div class="hub-fluffi">' + F.art.fluffi(st.outfit, 'normal', 'wave') + '</div>';
    scr.innerHTML = html;
    F.ui.snow(scr.querySelector('.snow'), 14);

    // Naechstes Geschenk: Fortschrittsbalken
    var nx = F.rewards.next(st);
    var ng = scr.querySelector('.next-gift');
    if (nx) {
      var prev = 0;
      F.rewards.items.forEach(function (it) { if (it.at <= st.stars && it.at > prev) prev = it.at; });
      var pct = Math.max(4, Math.min(100, ((st.stars - prev) / Math.max(1, nx.at - prev)) * 100));
      ng.innerHTML = '<div class="gift-bar"><div style="width:' + pct + '%"></div></div><span class="gift-ico">🎁</span>';
    }

    F.gameOrder.forEach(function (id, i) {
      var g = F.games[id];
      var pos = F.ui.STATION_POS[i] || [50, 50];
      var open = F.isGameUnlocked(st, id);
      var b = F.el('button', 'station ' + (open ? 'open' : 'locked'));
      b.style.left = pos[0] + '%';
      b.style.top = pos[1] + '%';
      b.style.setProperty('--c', g.color);
      var lvl = st.levels[id] || 1;
      b.innerHTML = '<span class="st-icon">' + g.icon + '</span>' +
        (open ? '<span class="st-level">' + F.ui.levelPips(lvl) + '</span>'
          : '<span class="st-lock">🔒</span><span class="st-need">★ ' + g.unlockAt + '</span>');
      b.setAttribute('aria-label', g.title);
      F.onTap(b, function () {
        if (open) { F.speech.stop(); F.ui.runGame(id); }
        else {
          F.sound.play('wrong');
          F.speech.say('Hier brauchst du ' + F.numWord(g.unlockAt) + ' Sterne. Sammle noch mehr Sterne!');
          b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
        }
      }, true);
      scr.appendChild(b);
    });

    var fl = scr.querySelector('.hub-fluffi');
    F.onTap(fl, function () {
      F.sound.play('pop');
      fl.classList.remove('hop'); void fl.offsetWidth; fl.classList.add('hop');
      F.speech.say(F.rng.pick(['Hallo' + F.nameComma() + '! Wohin gehen wir heute?', 'Ich bin so froh, dass du mit mir spielst' + F.nameComma() + '!', 'Tippe auf ein Bild, dann spielen wir!', 'Ich liebe Fische!', 'Schau mal, meine Schleife!', 'Sammle Sterne, dann gibt es Geschenke!']));
    }, true);
    F.onTap(scr.querySelector('.wardrobe-btn'), function () { F.ui.wardrobe(); });
    F.onTap(scr.querySelector('.album-btn'), function () { F.ui.album(); });
    F.ui.holdButton(scr.querySelector('.parent-btn'), 2000, function () { F.ui.parents(); });

    if (greet) {
      setTimeout(function () {
        if (F.currentToken !== token) return;
        F.speech.say(st.plays && Object.keys(st.plays).length
          ? 'Hallo' + F.nameComma() + ', da bist du ja wieder! Tippe auf ein Bild.'
          : 'Hallo' + F.nameComma() + '! Ich bin Fluffi, das kleine Pinguinmädchen. Tippe auf ein Bild, dann spielen wir zusammen!');
      }, 400);
    }
  });
};

F.ui.pathD = function () {
  var p = F.ui.STATION_POS.slice(0, F.gameOrder.length);
  var d = 'M 8 72';
  p.forEach(function (q) { d += ' L ' + q[0] + ' ' + q[1]; });
  return d;
};

F.ui.levelPips = function (lvl) {
  var s = '';
  for (var i = 1; i <= F.MAX_LEVEL; i++) s += '<i class="' + (i <= lvl ? 'on' : '') + '"></i>';
  return s;
};

/* Knopf, der gedrueckt gehalten werden muss (Elternbereich) */
F.ui.holdButton = function (btn, ms, fn) {
  var t = null;
  var start = function (e) {
    e.preventDefault();
    btn.classList.add('holding');
    t = setTimeout(function () { btn.classList.remove('holding'); t = null; fn(); }, ms);
  };
  var stop = function () { btn.classList.remove('holding'); if (t) { clearTimeout(t); t = null; } };
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', stop);
  btn.addEventListener('pointerleave', stop);
  btn.addEventListener('pointercancel', stop);
  btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
};

/* ---------- Spielrahmen ---------- */
F.ui.runGame = function (id) {
  var g = F.games[id];
  var level = F.state.levels[id] || 1;
  F.show(function (scr, token) {
    scr.classList.add('game-screen', 'g-' + id);
    scr.style.setProperty('--c', g.color);
    scr.innerHTML = '<div class="game-head">' +
      '<button class="round-btn home-btn" aria-label="Zur Karte">🏠</button>' +
      '<div class="progress"></div>' +
      '<button class="round-btn speak-btn" aria-label="Nochmal hören">🔊</button></div>' +
      '<div class="stage"></div>';
    var stage = scr.querySelector('.stage');
    var progEl = scr.querySelector('.progress');
    var mistakes = 0;
    var finished = false;
    var ctx = {
      level: level,
      rng: F.makeRng((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0),
      stage: stage,
      alive: function () { return !finished && F.currentToken === token; },
      say: function (t, o) { return ctx.alive() ? F.speech.say(t, o) : Promise.resolve(); },
      sound: function (n) { if (ctx.alive()) F.sound.play(n); },
      mistake: function () { mistakes++; },
      mistakes: function () { return mistakes; },
      progress: function (done, total) {
        var h = '';
        for (var i = 0; i < total; i++) h += '<i class="' + (i < done ? 'done' : (i === done ? 'now' : '')) + '"></i>';
        progEl.innerHTML = h;
      },
      progressBar: function (frac) {
        progEl.innerHTML = '<div class="pbar"><div style="width:' + Math.round(Math.min(1, frac) * 100) + '%"></div><span class="pbar-goal">🏁</span></div>';
      },
      finish: function (opts) {
        if (finished) return;
        finished = true;
        opts = opts || {};
        var stars = opts.stars || F.starsFor(mistakes, opts.tasks || 5);
        F.sound.play('win');
        setTimeout(function () { if (F.currentToken === token) F.ui.result(id, stars); }, 900);
      }
    };
    F.onTap(scr.querySelector('.home-btn'), function () { F.ui.hub(false); });
    F.onTap(scr.querySelector('.speak-btn'), function () { F.speech.repeat(); });
    var inst = null;
    try { inst = g.create(stage, ctx); } catch (e) { console.error(e); }
    return { destroy: function () { finished = true; if (inst && inst.destroy) inst.destroy(); } };
  });
};

F.ui.result = function (id, stars) {
  var before = F.state.stars;
  var res = F.applyResult(F.state, id, stars);
  F.store.save(F.state);
  var newGames = F.gameOrder.filter(function (gid) {
    var u = F.games[gid].unlockAt || 0;
    return u > before && u <= F.state.stars;
  });
  F.show(function (scr, token) {
    scr.classList.add('result-screen');
    scr.innerHTML = '<div class="confetti"></div>' +
      '<div class="res-fluffi jump">' + F.art.fluffi(F.state.outfit, 'happy') + '</div>' +
      '<div class="res-stars"><span>★</span><span>★</span><span>★</span></div>' +

      '<button class="round-btn big map" aria-label="Karte">🗺️</button></div>';
    F.ui.confetti(scr.querySelector('.confetti'));
    var spans = scr.querySelectorAll('.res-stars span');
    var alive = function () { return F.currentToken === token; };
    for (var i = 0; i < stars; i++) {
      (function (k) { setTimeout(function () { if (!alive()) return; spans[k].classList.add('on'); F.sound.play('star'); }, 350 + k * 450); })(i);
